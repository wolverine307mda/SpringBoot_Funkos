# version: '3.8'
services:
  mongo:
    container_name: pedidos-db_mongo
    image: mongo:5.0
    restart: always
    env_file: .env
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"

  mongo-express:
    container_name: funkos-db_mongo-express
    image: mongo-express
    restart: always
    env_file: .env
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo